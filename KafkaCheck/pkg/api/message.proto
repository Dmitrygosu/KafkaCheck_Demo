// =============================================================================
// Protocol Buffers определение для сообщений Kafka
// =============================================================================
// Используется для сериализации/десериализации сообщений
// =============================================================================

syntax = "proto3";
package api
option go_package = ".";

// KafkaMessage - структура сообщения для передачи через Kafka
message KafkaMessage {
  // id - уникальный идентификатор сообщения
  string id = 1;
  
  // content - содержимое сообщения
  string content = 2;
  
  // timestamp - время создания сообщения (Unix timestamp)
  int64 timestamp = 3;
}
