// Wire format of the demo messages exchanged through Kafka.
// Regenerate the Go code with `make proto`.

syntax = "proto3";

package api;

option go_package = "github.com/Dmitrygosu/KafkaCheck_Demo/KafkaCheck/pkg/api;api";

// KafkaMessage is a message produced to and consumed from the demo topic.
message KafkaMessage {
  // id is the unique message id; it is also used as the Kafka key.
  string id = 1;

  // content is the message payload.
  string content = 2;

  // timestamp is the creation time as a Unix timestamp in seconds.
  int64 timestamp = 3;
}
