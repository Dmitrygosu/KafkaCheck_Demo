name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: KafkaCheck

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: KafkaCheck/go.mod
          cache-dependency-path: KafkaCheck/go.sum
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: KafkaCheck

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: KafkaCheck/go.mod
          cache-dependency-path: KafkaCheck/go.sum
          check-latest: true
      - run: go build ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -n 1

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: KafkaCheck/go.mod
          cache-dependency-path: KafkaCheck/go.sum
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
